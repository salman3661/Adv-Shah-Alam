name: Daily Cloud Autopilot (Advocate Md. Shah Alam)

on:
  schedule:
    # Runs every morning at 08:00 AM Bangladesh Standard Time (02:00 UTC)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual 1-click execution anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  autopilot:
    name: Generate Trending Legal Post & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Cloud Autopilot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_ACTIONS: 'true'
        run: node scripts/cloud-autopilot.mjs

      - name: Push Updates (Fallback if script did not push)
        run: |
          git config user.name "Advocate Shah Alam Autopilot"
          git config user.email "bot@advmdshahalam.me"
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "feat(autopilot): daily autonomous content & sync update"
            git push origin main
          fi

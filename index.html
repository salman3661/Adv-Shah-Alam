  <!-- Anti-FOUC: set theme BEFORE any paint — runs before fonts/styles load -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = stored ? stored === 'dark' : systemDark;
        var theme = isDark ? 'dark' : 'light';
        document.documentElement.classList.add('no-theme-transition');
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.classList.toggle('dark', isDark);
        requestAnimationFrame(function () {
          document.documentElement.classList.remove('no-theme-transition');
        });
      } catch (e) { }
    })();
  </script>

<script>

  <!-- Page-scoped JSON-LD injected per route by prerender.mjs and React pages -->
  <!-- Google Analytics, AdSense & Custom Webfont — loaded on first user interaction so initial FCP/LCP/TBT/SI remain 100% unblocked -->
  <script>
    (function () {
      var gaLoaded = false;
      var adsLoaded = false;
      var fontLoaded = false;
      var interacted = false;

      function loadFont() {
        if (fontLoaded) return;
        fontLoaded = true;
        try {
          var st = document.createElement('style');
          st.textContent =
            "@font-face{font-family:'Noto Serif Bengali';font-style:normal;font-weight:400 800;font-stretch:100%;font-display:swap;src:url('/fonts/NotoSerifBengali-var-bengali.woff2') format('woff2');unicode-range:U+0951-0952,U+0964-0965,U+0980-09FE,U+1CD0,U+1CD2,U+1CD5-1CD6,U+1CD8,U+1CE1,U+1CEA,U+1CED,U+1CF2,U+1CF5-1CF7,U+200C-200D,U+20B9,U+25CC,U+A8F1,U+11DF0-11DF1;}" +
            "@font-face{font-family:'Noto Serif Bengali';font-style:normal;font-weight:400 800;font-stretch:100%;font-display:swap;src:url('/fonts/NotoSerifBengali-var-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}";
          document.head.appendChild(st);
          sessionStorage.setItem('bnFontLoaded', '1');
        } catch (e) {}
      }

      try {
        if (sessionStorage.getItem('bnFontLoaded') === '1') {
          loadFont();
        }
      } catch (e) {}

      function loadGA() {
        if (gaLoaded) return;
        gaLoaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-PJ4Z9WLRBS';
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', 'G-PJ4Z9WLRBS', { send_page_view: true });

        // Phase 9 GA4 Event Taxonomy
        function track(name, params) {
          try { if (typeof window.gtag === 'function') window.gtag('event', name, params || {}); } catch (e) {}
        }
        document.addEventListener('click', function (ev) {
          var a = ev.target && ev.target.closest ? ev.target.closest('a,button') : null;
          if (!a) return;
          var href = a.getAttribute('href') || '';
          if (href.indexOf('wa.me') !== -1 || href.indexOf('whatsapp.com') !== -1) {
            track('whatsapp_click', { link_url: href, page_path: location.pathname });
          } else if (href.indexOf('tel:') === 0) {
            track('call_click', { link_url: href, page_path: location.pathname });
          } else if (href.indexOf('/contact') !== -1 || a.dataset.cta === 'consult') {
            track('consult_cta_click', { link_url: href || 'button', page_path: location.pathname });
          } else if (a.closest && a.closest('.adsbygoogle, .ad-slot-reserved')) {
            track('ad_click', { page_path: location.pathname });
          }
        }, { passive: true });
        var formStarted = false;
        document.addEventListener('focusin', function (ev) {
          if (!formStarted && ev.target && ev.target.closest && ev.target.closest('form')) {
            formStarted = true;
            track('form_start', { page_path: location.pathname });
          }
        }, { passive: true });
        document.addEventListener('submit', function (ev) {
          if (ev.target && ev.target.tagName === 'FORM') {
            track('form_submit', { page_path: location.pathname });
          }
        }, { passive: true });
        var d50 = false, d90 = false;
        window.addEventListener('scroll', function () {
          var doc = document.documentElement;
          var pct = (window.scrollY + window.innerHeight) / Math.max(doc.scrollHeight, 1);
          if (!d50 && pct >= 0.5) { d50 = true; track('scroll_depth_50', { page_path: location.pathname }); }
          if (!d90 && pct >= 0.9) { d90 = true; track('scroll_depth_90', { page_path: location.pathname }); }
        }, { passive: true });
      }

      function loadAds() {
        var host = window.location && window.location.hostname;
        if (host !== 'www.advmdshahalam.me' && host !== 'advmdshahalam.me') {
          return;
        }
        if (adsLoaded || document.querySelector('script[src*="adsbygoogle.js"]')) {
          adsLoaded = true;
          return;
        }
        adsLoaded = true;
        var a = document.createElement('script');
        a.async = true;
        a.crossOrigin = 'anonymous';
        a.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1781126556775676';
        document.head.appendChild(a);
      }

      window.__ensureAdSenseLoaded = function () {
        if (interacted) {
          loadAds();
        }
      };

      var interactEvents = ['scroll', 'wheel', 'touchstart', 'pointerdown', 'mousemove', 'keydown'];
      function onFirstInteract() {
        if (interacted) return;
        interacted = true;
        loadFont();
        loadAds();
        loadGA();
        for (var i = 0; i < interactEvents.length; i++) {
          window.removeEventListener(interactEvents[i], onFirstInteract);
        }
      }
      for (var i = 0; i < interactEvents.length; i++) {
        window.addEventListener(interactEvents[i], onFirstInteract, { passive: true, once: true });
      }
    })();
  </script>
